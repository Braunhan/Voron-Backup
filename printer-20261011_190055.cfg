# This file contains common pin mappings for the BigTreeTech Octopus V1.
# To use this config, the firmware should be compiled for the STM32F446 with a "32KiB bootloader"
# Enable "extra low-level configuration options" and select the "12MHz crystal" as clock reference

# after running "make", copy the generated "klipper/out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the OctoPus with that SD card.

# See docs/Config_Reference.md for a description of parameters.

## Voron Design VORON2 250/300/350mm BigTreeTech OctoPus V1 TMC2209 UART config


[include include.cfg]
[skew_correction] 
[gcode_arcs]
resolution: 0.008
[exclude_object]

[mcu]
##--------------------------------------------------------------------
# serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_4C0028000551313433343333-if00
canbus_uuid: 3763500466d6
# restart_method: command
##--------------------------------------------------------------------
[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000             #Max 4000
#max_accel_to_decel:10000
max_z_velocity: 55 #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 20
minimum_cruise_ratio: 0.5

#####################################################################
#   X/Y Stepper Settings
#####################################################################
[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
tuning_goal: auto
[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
tuning_goal: auto
##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 128
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

# endstop_pin: ^can0:LIMIT_3 #PG6
endstop_pin: EBB:PA15
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 80  #Max 100
second_homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_speed: 100000
run_current:1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

##[tmc5160 stepper_x]
##cs_pin: PC4
##spi_speed: 100000
##spi_software_sclk_pin: PA5
##spi_software_mosi_pin: PA7
##spi_software_miso_pin: PA6
##run_current:1.2
##sense_resistor: 0.075
##interpolate: true

#[tmc2209 stepper_x]
#uart_pin: PC4
#interpolate: false
#run_current: 1
#sense_resistor: 0.110
#stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 128
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper

endstop_pin: PG9
position_min: 0
position_endstop: 303
position_max: 303
homing_speed: 60  #Max 100
second_homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD11
spi_speed: 100000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current:1
#sense_resistor: 0.075
#interpolate: true
#####################################################################
#   Z Stepper Settings
#####################################################################
#[autotune_tmc stepper_z]
#motor: omc-17hs19-2004s1
#tuning_goal: auto

#[autotune_tmc stepper_z1]
#motor: omc-17hs19-2004s1
#tuning_goal: auto

#[autotune_tmc stepper_z2]
#motor: omc-17hs19-2004s1
#voltage: 24
#tuning_goal: auto

#[autotune_tmc stepper_z3]
#motor: omc-17hs19-2004s1
#voltage: 24
#tuning_goal: auto

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
enable_pin: !PG5
step_pin: PF11
dir_pin: !PG3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

endstop_pin: PG10
position_endstop: -0.5
position_max: 260
position_min: -10
homing_speed: 15
second_homing_speed: 4
homing_retract_dist: 0.7

[tmc2240 stepper_z]
cs_pin: PC6 
spi_speed: 100000
run_current:1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6


##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
enable_pin: !PD4 #!PA0
step_pin: PE2 #PG4
dir_pin:  PE3 #!PC1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z1]
cs_pin: PE1 #PC7
spi_speed: 100000
run_current:1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6


##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
enable_pin: !PG2
step_pin: PF9
dir_pin: !PF10
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z2]
cs_pin: PF2
spi_speed: 100000
run_current:1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6


##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
enable_pin: !PF1
step_pin: PC13
dir_pin: PF0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z3]
cs_pin: PE4
spi_speed: 100000
run_current:1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6


#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA3
sensor_type:Generic 3950
sensor_pin: PF3
max_power: 1
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769



#####################################################################
#   Bed mesh
#####################################################################

[bed_mesh]
speed: 600
horizontal_move_z: 5.5
mesh_min: 40, 40
mesh_max: 260,260
fade_start: 0.6
fade_end: 10.0
probe_count: 7,7
algorithm: bicubic
zero_reference_position: 150, 150

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800


[quad_gantry_level]
gantry_corners:
    -57,-1
    407,423
points:
   20,1
   20,250
   295,250
   295,1
   
speed: 500
horizontal_move_z: 15
retries: 10
retry_tolerance: 0.015 # Dont need a million retries, mesh can pick up the slack...
max_adjust: 20

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    #EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, # EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>


#####################################################################
#   Thermals
#####################################################################

[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF5
##min_temp: 0
##max_temp: 100
gcode_id: C


#####################################################################
#   Fan Control
#####################################################################

[multi_pin fan]
pins: PE5, PD12
[duplicate_pin_override]
pins:temperature_mcu


[temperature_fan Octopus_24V]
#pin = multi_pin:fan
pin: PA8
kick_start_time: 0.5
max_power: 1
min_temp: 0
max_temp: 90
max_delta: 5
target_temp: 45
control: watermark
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769
shutdown_speed: 0
sensor_type: temperature_mcu


[temperature_fan Raspberry_Pi_12V]
pin = multi_pin:fan
#pin: PE5
kick_start_time: 0.5
max_power: 1
min_temp: 0
max_temp: 90
max_speed: 1

max_delta: 10
#hardware_pwm: true
target_temp: 40
control: watermark
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769
shutdown_speed: 0
sensor_type: temperature_host

[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
# number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
# show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
# timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

# This file contains common pin mappings for the BIGTREETECH EBB36
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)" .
# The "EBB36 GEN2" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBB]
# serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid=fa50ca5ee1dc

[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: EBB:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[resonance_tester]
accel_chip: lis2dw
accel_per_hz: 50  # Lower value reduces sampling rate if high vibrations occur
probe_points:
    150, 150, 20  # Adjust for your bed size (e.g., 350mm)

[extruder]
step_pin: EBB:PB14
dir_pin: EBB:PA8
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB4
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: EBB:PA3
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

#####################################################################
#   Probe
#####################################################################

[probe]
pin: !EBB:PB8
x_offset: 0
y_offset: 25
z_offset: 5
speed: 15
samples: 2
sample_retract_dist: 0.8
lift_speed: 25.0
samples_result: median
samples_tolerance: 0.01
samples_tolerance_retries: 5

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.650
stealthchop_threshold: 999999

#[filament_switch_sensor fil_det]
#switch_pin: EBB:PD0

[fan]
pin: EBB:PD3

[heater_fan hotend_fan]
pin: EBB:PA5
heater: extruder
heater_temp: 50.0

#[heater_fan 3w_fan2]
#pin: EBB:PD2
#tachometer_pin: EBB:PA4

#[neopixel hotend_rgb]
#pin: EBB:PC7

