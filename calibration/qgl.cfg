# =============================================================================
# calibration/qgl.cfg — Quad Gantry Leveling
# =============================================================================
# Richtet die vier Z-Motoren des Voron 2.4 so aus, dass das Gantry
# parallel zum Bett steht. Die Punkte liegen nahe der Z-Spindeln,
# um mechanische Verwindung zu minimieren.
#
# gantry_corners: Position der Z-Spindeln relativ zum Düsen-Nullpunkt
# points:         Messpunkte nahe der Bett-Ecken
# =============================================================================

[quad_gantry_level]
gantry_corners:
    -60, -10
    360, 370
points:
    20, 1
    20, 250
    295, 250
    295, 1
speed: 500
horizontal_move_z: 25
retries: 10
retry_tolerance: 0.015
max_adjust: 20