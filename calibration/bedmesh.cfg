# =============================================================================
# calibration/bedmesh.cfg — Bett-Netz (Bed Mesh)
# =============================================================================
# Scan-Mode mit Cartographer: 20×20 Gitter, keine Interpolation (PPS=0).
# Adaptive Margins für KAMP/adaptive meshing.
# =============================================================================

# --- ALT: 7×7 Punkt-Mesh (Klick) -------------------------------------------
# [bed_mesh]
# speed: 600
# horizontal_move_z: 5.5
# mesh_min: 40, 40
# mesh_max: 260, 260
# fade_start: 0.6
# fade_end: 10.0
# probe_count: 7, 7
# algorithm: bicubic
# zero_reference_position: 150, 150

# --- Scan-Mode (Cartographer) -------------------------------------------------
[bed_mesh]
speed: 300
horizontal_move_z: 3
mesh_min: 40, 40
mesh_max: 260, 260
zero_reference_position: 150, 150
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0, 0
fade_start: 0.6
fade_end: 10.0
algorithm: bicubic
