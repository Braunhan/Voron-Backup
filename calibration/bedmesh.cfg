# =============================================================================
# calibration/bedmesh.cfg — Bett-Netz (Bed Mesh)
# =============================================================================
# Erstellt ein 7×7-Messgitter zur Kompensation von Bett-Unebenheiten.
# Bikubische Interpolation für glatte Übergänge. Fade-out über die
# ersten 10 mm Druckhöhe, um plötzliche Z-Sprünge zu vermeiden.
# =============================================================================

[bed_mesh]
speed: 600
horizontal_move_z: 5.5
mesh_min: 40, 40
mesh_max: 260, 260
fade_start: 0.6
fade_end: 10.0
probe_count: 7, 7
algorithm: bicubic
zero_reference_position: 150, 150