# =============================================================================
# calibration/safezhome.cfg — Safe Z Homing
# =============================================================================
# Sichert das Z-Homing ab: Fährt mittig über das Bett, bevor Z
# gehomt wird. Nötig für probe:z_virtual_endstop mit Cartographer.
# =============================================================================

[safe_z_home]
home_xy_position: 150, 150
speed: 50
z_hop: 10
