# =============================================================================
# calibration/shaper.cfg — Input Shaper & Resonanzkompensation
# =============================================================================
# Standard-Sensor: LIS2DW im EBB36 (weniger Rauschen als der Cartographer-ADXL345).
# Beide Sensoren nacheinander testen: SHAKETUNE_ALL_SENSORS (macros/shaketune_all.cfg)
# Die Shaper-Werte werden automatisch durch SHAPER_CALIBRATE ermittelt
# und in SAVE_CONFIG gespeichert.
#
# Shake&Tune: Erweiterte Analyse-Plattform für Input Shaper,
#             Riemenspannung und mechanische Diagnose.
# =============================================================================

# --- ALT: LIS2DW am EBB36 (auskommentiert) -----------------------------------
# [resonance_tester]
# accel_chip: lis2dw
# accel_per_hz: 50
# probe_points:
#     150, 150, 20

# --- Input Shaper (Werte via SAVE_CONFIG) ------------------------------------
# [input_shaper]
# shaper_type_x = mzv
# shaper_freq_x = 65.4
# shaper_type_y = mzv
# shaper_freq_y = 46.0

# --- Resonanz-Tester (Cartographer ADXL345) ----------------------------------
[resonance_tester]
accel_chip: lis2dw
#accel_chip: adxl345 cartographer
accel_per_hz: 50
probe_points:
    150, 150, 20

# --- Shake&Tune --------------------------------------------------------------
[shaketune]
# Ergebnisse werden im Ordner ShakeTune_results gespeichert.
# show_macros_in_webui: true zeigt die Makros in Mainsail/Fluidd an.
