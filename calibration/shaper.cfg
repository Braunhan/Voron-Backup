# =============================================================================
# calibration/shaper.cfg — Input Shaper & Resonanzkompensation
# =============================================================================
# Nutzt den integrierten LIS2DW-Sensor des EBB36 Gen2 zur Messung
# der Resonanzfrequenzen. Die Shaper-Werte werden automatisch durch
# SHAPER_CALIBRATE ermittelt und in SAVE_CONFIG gespeichert.
#
# Shake&Tune: Erweiterte Analyse-Plattform für Input Shaper,
#             Riemenspannung und mechanische Diagnose.
# =============================================================================

# --- Input Shaper (Werte via SAVE_CONFIG) ------------------------------------
# [input_shaper]
# shaper_type_x = mzv
# shaper_freq_x = 65.4
# shaper_type_y = mzv
# shaper_freq_y = 46.0

# --- Resonanz-Tester ---------------------------------------------------------
[resonance_tester]
accel_chip: lis2dw
accel_per_hz: 50
probe_points:
    150, 150, 20

# --- Shake&Tune --------------------------------------------------------------
[shaketune]
# Ergebnisse werden im Ordner ShakeTune_results gespeichert.
# show_macros_in_webui: true zeigt die Makros in Mainsail/Fluidd an.