# =============================================================================
# calibration/axistwist.cfg — Axis Twist Compensation
# =============================================================================
# Kompensiert X- und Y-Achsen-Verdrehung (Twist) des Gantry,
# häufig bei CoreXY-Druckern mit langen X-Schienen.
# =============================================================================

[axis_twist_compensation]
# --- X-Achsen-Verdrehung -----------------------------------------------------
calibrate_start_x: 40
calibrate_end_x: 260
calibrate_y: 150

# --- Y-Achsen-Verdrehung -----------------------------------------------------
calibrate_start_y: 40
calibrate_end_y: 260
calibrate_x: 150
