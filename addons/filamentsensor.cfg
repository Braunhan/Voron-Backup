# =============================================================================
# addons/filamentsensor.cfg — Filament-Sensor
# =============================================================================
# Zwei unabhängige Sensoren:
#   - switch_sensor:  Mechanischer Endschalter an PG15
#   - encoder_sensor: Bewegungssensor (Encoder) an PG11
#
# Beide werden bei Druckstart aktiviert (SFS_ENABLE) und
# bei Druckende deaktiviert (SFS_DISABLE).
# =============================================================================

# --- Mechanischer Schalter ---------------------------------------------------
[filament_switch_sensor switch_sensor]
switch_pin: PG15
pause_on_runout: True
runout_gcode:
    M117 Filament switch runout
insert_gcode:
    M117 Filament switch inserted

# --- Bewegungssensor (Encoder) -----------------------------------------------
[filament_motion_sensor encoder_sensor]
switch_pin: PG11
detection_length: 20
extruder: extruder
pause_on_runout: True
runout_gcode:
    M117 Filament encoder runout
insert_gcode:
    M117 Filament encoder inserted

# --- Automatisch deaktivieren beim Start -------------------------------------
[delayed_gcode DISABLEFILAMENTSENSOR]
initial_duration: 1
gcode:
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0

# --- SFS_ENABLE: In PRINT_START aufrufen ------------------------------------
[gcode_macro SFS_ENABLE]
description: Aktiviert beide Filament-Sensoren
gcode:
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=1

# --- SFS_DISABLE: In PRINT_END/PRINT_CANCEL aufrufen ------------------------
[gcode_macro SFS_DISABLE]
description: Deaktiviert beide Filament-Sensoren
gcode:
    G92 E0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0