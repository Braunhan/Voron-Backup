# =============================================================================
# addons/zero_overshoot.cfg — Zero Overshoot PID Dämpfung
# =============================================================================
# Nach jedem PID_CALIBRATE werden Kp/Ki/Kd mit den Multiplikatoren
# verrechnet, um Überschwinger zu reduzieren.
#
# Deaktivierbar pro Aufruf: PID_CALIBRATE ... ZERO_OVERSHOOT=0
# =============================================================================

[zero_overshoot heater_bed]
zero_overshoot: True
Kp_multiplier: 1.0000000000
Ki_multiplier: 1.0000000000
Kd_multiplier: 1.0000000000

[zero_overshoot extruder]
zero_overshoot: True
Kp_multiplier: 1.0000000000
Ki_multiplier: 1.0000000000
Kd_multiplier: 1.0000000000