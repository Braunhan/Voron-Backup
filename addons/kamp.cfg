# =============================================================================
# addons/kamp.cfg — KAMP (Klipper Adaptive Meshing & Purging)
# =============================================================================
# Aktivierte Funktionen:
#   - Line_Purge: Adaptive Purge-Linie vor dem Druck
#   - (Adaptive_Meshing, Voron_Purge, Smart_Park sind deaktiviert)
#
# Einstellungen im _KAMP_Settings-Makro anpassbar.
# =============================================================================

# --- KAMP-Module -------------------------------------------------------------
[include ../KAMP/Line_Purge.cfg]

# --- KAMP-Einstellungen ------------------------------------------------------
[gcode_macro _KAMP_Settings]
description: Zentrale KAMP-Konfiguration
variable_verbose_enable: True
variable_mesh_margin: 0
variable_fuzz_amount: 0
variable_probe_dock_enable: False         # Kein Dock (Probe direkt an PB8)
variable_purge_height: 0.8
variable_tip_distance: 0
variable_purge_margin: 10
variable_purge_amount: 30
variable_flow_rate: 12
variable_smart_park_height: 10
gcode:
    {action_respond_info("KAMP_Settings geladen.")}