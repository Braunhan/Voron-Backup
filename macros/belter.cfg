# =============================================================================
# macros/belter.cfg — BIQU Belter Riemenspannungs-Messung
# =============================================================================
# Formel aus dem BIQU Web-Tool (belter.bttwiki.com):
#   Spannung(N) = A / (dmax - d)^p      A = 23.51, p = 1.2283
#   dmax = Kalibrier-Anzeige (Nullstell-Werkzeug) + Riemendicke
# Sollbereich: 1.5 – 3.0 N pro mm Riemenbreite, Gleichheit <= 10 %
#
# Ablauf A/B-Riemen:
#   1. BELTER_POS_XY                      -> fährt Messposition an, zeigt Zielwerte
#   2. Belter jeweils mittig auf den Abschnitt am X-Träger setzen
#   3. BELTER_XY LINKS=5.90 RECHTS=5.88   (links = unterer Riemen, rechts = oberer Riemen)
#      Optional CAL=6.01: neuer Kalibrierwert, gilt bis zum nächsten Klipper-Neustart.
#      Dauerhaft ändern: variable_cal_reading unten anpassen.
#
# Ablauf Z-Riemen:
#   1. BELTER_POS_Z
#   2. BELTER_Z VORNE_LINKS=.. HINTEN_LINKS=.. HINTEN_RECHTS=.. VORNE_RECHTS=..
# =============================================================================

# --- Einstellungen -----------------------------------------------------------
[gcode_macro _BELTER_VARS]
variable_cal_reading: 6.01      # Anzeige mit Nullstell-Werkzeug
variable_coef_a: 23.51          # Modell-Koeffizient A (BIQU Standard)
variable_exp_p: 1.2283          # Modell-Exponent p (BIQU Standard)
variable_xy_thickness: 1.4      # Riemendicke A/B in mm
variable_xy_width: 6            # Riemenbreite A/B in mm
variable_z_thickness: 1.4       # Riemendicke Z in mm
variable_z_width: 9             # Riemenbreite Z in mm
variable_xy_pos_x: 162          # X, bei dem beide Riemenabschnitte am X-Träger gleich lang sind
gcode:

# --- Zielwerte anzeigen (intern) ---------------------------------------------
[gcode_macro _BELTER_TARGETS]
gcode:
    {% set v = printer["gcode_macro _BELTER_VARS"] %}
    {% set type = params.TYPE|default("XY")|upper %}
    {% set thick = v.z_thickness if type == "Z" else v.xy_thickness %}
    {% set width = v.z_width if type == "Z" else v.xy_width %}
    {% set dmax = v.cal_reading + thick %}
    {% set t_min = 1.5 * width %}
    {% set t_mid = 2.25 * width %}
    {% set t_max = 3.0 * width %}
    {% set d_min = dmax - (v.coef_a / t_min) ** (1 / v.exp_p) %}
    {% set d_mid = dmax - (v.coef_a / t_mid) ** (1 / v.exp_p) %}
    {% set d_max = dmax - (v.coef_a / t_max) ** (1 / v.exp_p) %}
    {action_respond_info(
        "Belter %s-Riemen (%d mm, dmax %.2f)\n"
        "Ziel-Anzeige: %.2f (%.1f N) ... %.2f (%.1f N) ... %.2f (%.1f N)\n"
        "Danach: %s"
        % (type, width, dmax, d_min, t_min, d_mid, t_mid, d_max, t_max,
           "BELTER_Z VORNE_LINKS=.. HINTEN_LINKS=.. HINTEN_RECHTS=.. VORNE_RECHTS=.." if type == "Z"
           else "BELTER_XY LINKS=.. RECHTS=.."))}

# --- Auswertung (intern) -----------------------------------------------------
[gcode_macro _BELTER_CALC]
gcode:
    {% set v = printer["gcode_macro _BELTER_VARS"] %}
    {% set type = params.TYPE|default("XY")|upper %}
    {% set thick = v.z_thickness if type == "Z" else v.xy_thickness %}
    {% set width = v.z_width if type == "Z" else v.xy_width %}
    {% set dmax = v.cal_reading + thick %}
    {% set t_min = 1.5 * width %}
    {% set t_max = 3.0 * width %}
    {% set labels = {
        'LINKS': 'Links (unten)', 'RECHTS': 'Rechts (oben)',
        'VORNE_LINKS': 'Z0 vorne links', 'HINTEN_LINKS': 'Z1 hinten links',
        'HINTEN_RECHTS': 'Z2 hinten rechts', 'VORNE_RECHTS': 'Z3 vorne rechts'
    } %}
    {% set order = ['VORNE_LINKS', 'HINTEN_LINKS', 'HINTEN_RECHTS', 'VORNE_RECHTS'] if type == "Z" else ['LINKS', 'RECHTS'] %}
    {% set ns = namespace(lines=[], vals=[]) %}
    {% for n in order if n in params and params[n]|float > 0 %}
        {% set d = params[n]|float %}
        {% if d >= dmax %}
            {action_raise_error("BELTER: %s=%.2f muss kleiner als %.2f sein (Kalibrierung prüfen)" % (labels[n], d, dmax))}
        {% endif %}
        {% set t = v.coef_a / (dmax - d) ** v.exp_p %}
        {% set status = "zu locker" if t < t_min else ("zu straff" if t > t_max else "OK") %}
        {% set ns.vals = ns.vals + [t] %}
        {% set ns.lines = ns.lines + ["%s: %.2f -> %.1f N (%s)" % (labels[n], d, t, status)] %}
    {% endfor %}
    {% if ns.vals|length == 0 %}
        {action_raise_error("BELTER: keine Messwerte eingetragen")}
    {% endif %}
    {% set summary = "Belter %s (%d mm, Soll %.1f-%.1f N, Kalibrierung %.2f)" % (type, width, t_min, t_max, v.cal_reading) %}
    {% if ns.vals|length > 1 %}
        {% set avg = (ns.vals|sum) / (ns.vals|length) %}
        {% set diff = ((ns.vals|max) - (ns.vals|min)) / avg * 100 %}
        {% set ns.lines = ns.lines + ["Abweichung: %.1f %% (%s)" % (diff, "OK" if diff <= 10 else "zu groß, angleichen")] %}
    {% endif %}
    {action_respond_info(summary ~ "\n" ~ ns.lines|join("\n"))}

# --- Messposition A/B-Riemen -------------------------------------------------
[gcode_macro BELTER_POS_XY]
description: Fährt den Kopf zur Belter-Messposition der A/B-Riemen (gleich lange Abschnitte)
gcode:
    {% set v = printer["gcode_macro _BELTER_VARS"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 Z{[printer.toolhead.position.z, 50]|max} F1500
    G1 X{v.xy_pos_x} Y{printer.toolhead.axis_maximum.y / 2} F6000
    M400
    _BELTER_TARGETS TYPE=XY

# --- Messposition Z-Riemen ---------------------------------------------------
[gcode_macro BELTER_POS_Z]
description: Homt + QGL (falls nötig), fährt das Gantry auf halbe Höhe für die Z-Riemen
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # Gantry muss gerade stehen, sonst sind die Z-Riemenabschnitte unterschiedlich lang
    {% if not printer.quad_gantry_level.applied %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}
    G90
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
    G1 Z{printer.toolhead.axis_maximum.z / 2} F1500
    M400
    _BELTER_TARGETS TYPE=Z

# --- Eingabe A/B-Riemen ------------------------------------------------------
[gcode_macro BELTER_XY]
description: Belter-Anzeigen der A/B-Riemen eintragen -> Spannung in N (CAL optional)
gcode:
    {% set links = params.LINKS|default(0)|float %}
    {% set rechts = params.RECHTS|default(0)|float %}
    {% set cal = params.CAL|default(0)|float %}
    {% if cal > 0 %}
        SET_GCODE_VARIABLE MACRO=_BELTER_VARS VARIABLE=cal_reading VALUE={cal}
    {% endif %}
    _BELTER_CALC TYPE=XY LINKS={links} RECHTS={rechts}

# --- Eingabe Z-Riemen --------------------------------------------------------
[gcode_macro BELTER_Z]
description: Belter-Anzeigen der 4 Z-Riemen eintragen -> Spannung in N (CAL optional)
gcode:
    {% set vorne_links = params.VORNE_LINKS|default(0)|float %}
    {% set hinten_links = params.HINTEN_LINKS|default(0)|float %}
    {% set hinten_rechts = params.HINTEN_RECHTS|default(0)|float %}
    {% set vorne_rechts = params.VORNE_RECHTS|default(0)|float %}
    {% set cal = params.CAL|default(0)|float %}
    {% if cal > 0 %}
        SET_GCODE_VARIABLE MACRO=_BELTER_VARS VARIABLE=cal_reading VALUE={cal}
    {% endif %}
    _BELTER_CALC TYPE=Z VORNE_LINKS={vorne_links} HINTEN_LINKS={hinten_links} HINTEN_RECHTS={hinten_rechts} VORNE_RECHTS={vorne_rechts}
