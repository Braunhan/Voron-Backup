# =============================================================================
# macros/belter.cfg — BIQU Belter Riemenspannungs-Messung
# =============================================================================
# Formel aus dem BIQU Web-Tool (belter.bttwiki.com):
#   Spannung(N) = A / (dmax - d)^p      A = 23.51, p = 1.2283
#   dmax = Kalibrier-Anzeige (Nullstell-Werkzeug) + Riemendicke
# Sollbereich: 1.5 – 3.0 N pro mm Riemenbreite, Gleichheit <= 10 %
#
# Ablauf:
#   1. BELTER_POS_XY  bzw.  BELTER_POS_Z   -> fährt Messposition an, zeigt Zielwerte
#   2. Belter an den Riemen ansetzen, Anzeigen notieren
#   3. BELTER_CALC TYPE=XY A=5.90 B=5.88
#      BELTER_CALC TYPE=Z  A=.. B=.. C=.. D=..   (A=Z0 vorne links, B=Z1 hinten links,
#                                                 C=Z2 hinten rechts, D=Z3 vorne rechts)
# =============================================================================

# --- Einstellungen -----------------------------------------------------------
[gcode_macro _BELTER_VARS]
variable_cal_reading: 6.01      # Anzeige mit Nullstell-Werkzeug
variable_coef_a: 23.51          # Modell-Koeffizient A (BIQU Standard)
variable_exp_p: 1.2283          # Modell-Exponent p (BIQU Standard)
variable_xy_thickness: 1.4      # Riemendicke A/B in mm
variable_xy_width: 6            # Riemenbreite A/B in mm
variable_z_thickness: 1.4       # Riemendicke Z in mm
variable_z_width: 9             # Riemenbreite Z in mm
variable_xy_pos_x: 162         # X, bei dem beide Riemenabschnitte am X-Träger gleich lang sind
gcode:

# --- Zielwerte anzeigen (intern) ---------------------------------------------
[gcode_macro _BELTER_TARGETS]
gcode:
    {% set v = printer["gcode_macro _BELTER_VARS"] %}
    {% set type = params.TYPE|default("XY")|upper %}
    {% set thick = v.z_thickness if type == "Z" else v.xy_thickness %}
    {% set width = v.z_width if type == "Z" else v.xy_width %}
    {% set dmax = v.cal_reading + thick %}
    {% set t_min = 1.5 * width %}
    {% set t_mid = 2.25 * width %}
    {% set t_max = 3.0 * width %}
    {% set d_min = dmax - (v.coef_a / t_min) ** (1 / v.exp_p) %}
    {% set d_mid = dmax - (v.coef_a / t_mid) ** (1 / v.exp_p) %}
    {% set d_max = dmax - (v.coef_a / t_max) ** (1 / v.exp_p) %}
    {action_respond_info(
        "Belter %s-Riemen (%d mm, dmax %.2f)\n"
        "Ziel-Anzeige: %.2f (%.1f N) ... %.2f (%.1f N) ... %.2f (%.1f N)\n"
        "Danach: BELTER_CALC TYPE=%s A=.. B=..%s"
        % (type, width, dmax, d_min, t_min, d_mid, t_mid, d_max, t_max,
           type, " C=.. D=.." if type == "Z" else ""))}

# --- Messposition A/B-Riemen -------------------------------------------------
[gcode_macro BELTER_POS_XY]
description: Fährt den Kopf zur Belter-Messposition der A/B-Riemen (gleich lange Abschnitte)
gcode:
    {% set v = printer["gcode_macro _BELTER_VARS"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 Z{[printer.toolhead.position.z, 50]|max} F1500
    G1 X{v.xy_pos_x} Y{printer.toolhead.axis_maximum.y / 2} F6000
    M400
    _BELTER_TARGETS TYPE=XY

# --- Messposition Z-Riemen ---------------------------------------------------
[gcode_macro BELTER_POS_Z]
description: Fährt das Gantry auf halbe Höhe für die Belter-Messung der Z-Riemen
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
    G1 Z{printer.toolhead.axis_maximum.z / 2} F1500
    M400
    _BELTER_TARGETS TYPE=Z

# --- Auswertung --------------------------------------------------------------
[gcode_macro BELTER_CALC]
description: Rechnet Belter-Anzeigen in Riemenspannung (N) um. TYPE=XY|Z A= B= [C= D=]
gcode:
    {% set v = printer["gcode_macro _BELTER_VARS"] %}
    {% set type = params.TYPE|default("XY")|upper %}
    {% set thick = v.z_thickness if type == "Z" else v.xy_thickness %}
    {% set width = v.z_width if type == "Z" else v.xy_width %}
    {% set dmax = v.cal_reading + thick %}
    {% set t_min = 1.5 * width %}
    {% set t_max = 3.0 * width %}
    {% set ns = namespace(lines=[], vals=[]) %}
    {% for n in ["A", "B", "C", "D"] if n in params %}
        {% set d = params[n]|float %}
        {% if d >= dmax %}
            {action_raise_error("BELTER: Anzeige %s=%.2f muss kleiner als dmax %.2f sein" % (n, d, dmax))}
        {% endif %}
        {% set t = v.coef_a / (dmax - d) ** v.exp_p %}
        {% set status = "zu locker" if t < t_min else ("zu straff" if t > t_max else "OK") %}
        {% set ns.vals = ns.vals + [t] %}
        {% set ns.lines = ns.lines + ["Riemen %s: %.2f -> %.1f N (%s)" % (n, d, t, status)] %}
    {% endfor %}
    {% if ns.vals|length == 0 %}
        {action_raise_error("BELTER: mindestens A= angeben, z.B. BELTER_CALC TYPE=XY A=5.90 B=5.88")}
    {% endif %}
    {% set summary = "Belter %s (%d mm, Soll %.1f-%.1f N, dmax %.2f)" % (type, width, t_min, t_max, dmax) %}
    {% if ns.vals|length > 1 %}
        {% set avg = (ns.vals|sum) / (ns.vals|length) %}
        {% set diff = ((ns.vals|max) - (ns.vals|min)) / avg * 100 %}
        {% set ns.lines = ns.lines + ["Abweichung: %.1f %% (%s)" % (diff, "OK" if diff <= 10 else "zu groß, angleichen")] %}
    {% endif %}
    {action_respond_info(summary ~ "\n" ~ ns.lines|join("\n"))}
