# =============================================================================
# macros/print.cfg — Druck-Start/Ende, Reinigung, Kalibrierung
# =============================================================================

# --- Quad Gantry Level (Zwei-Stufen) -----------------------------------------
[gcode_macro QGL_TWO_STEP]
gcode:
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=15 RETRY_TOLERANCE=1 RETRIES=10
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=6 RETRY_TOLERANCE=0.015 RETRIES=10

# --- Druck-Start -------------------------------------------------------------
[gcode_macro PRINT_START]
variable_bedtemp: 0
variable_hotendtemp: 0
variable_chambertemp: 0
gcode:
    {% set bed = params.BED|int %}
    {% set hotend = params.HOTEND|default(230)|int %}
    {% set chamber = params.CHAMBER|default(0)|int %}

    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=bedtemp VALUE={bed}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=hotendtemp VALUE={hotend}
    SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=chambertemp VALUE={chamber}
    CLEAR_PAUSE
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=0
    SET_PIN PIN=caselight VALUE=1
    _RESETSPEEDS
    SET_NOZZLE_LEDS_BY_NAME COLOR="WHITE"
    SET_LOGO_LEDS_BY_NAME COLOR="WHITE"

    M140 S{bed}
    G28
    G90
    {% if printer['temperature_sensor chamber'].temperature < chamber or printer.heater_bed.temperature < (bed-2) %}
        HEATSOAK T={bed} C={chamber} MOVE=1 WAIT=1
    {% else %}
        HEATSOAK T={bed} C={chamber} MOVE=0 WAIT=1
    {% endif %}
    M190 S{bed}
    SET_LOGO_LEDS_BY_NAME COLOR="WHITE"
    ATTACH_PROBE_LOCK
    QGL_TWO_STEP
    G28 Z
    G90
    G0 Z20
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F19500
    BED_MESH_CALIBRATE
    M109 S{hotend}
    G0 Z20
    DOCK_PROBE_UNLOCK
    crash
    CLEANNOZZLE
    crash
    G28 Z
    CALIBRATE_Z
    crash
    _SWIPENOZZLE
    crash
    LINE_PURGE
    # SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=1
    SKEW_PROFILE LOAD=calilantern_skew_profile
    status_printing

# --- Druck-Ende --------------------------------------------------------------
[gcode_macro PRINT_END]
gcode:
    SET_SKEW CLEAR=1
    # SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=switch_sensor ENABLE=0
    CLEAR_PAUSE
    M400
    G92 E0
    M104 S0
    M140 S{printer["gcode_macro PRINT_START"].bedtemp|int}
    M107
    G91
    G1 Z5 F3000
    G90
    G1 X{printer.toolhead.axis_maximum.x} Y{printer.toolhead.axis_maximum.y} F19500.0
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=600
    _RESETSPEEDS
    SET_NOZZLE_LEDS_BY_NAME COLOR="OFF"
    set_logo_leds_off
    RUN_SHELL_COMMAND CMD=git_backup

# --- Verzögertes Ausschalten -------------------------------------------------
[delayed_gcode DELAYED_OFF]
gcode:
    OFF

# --- Düsenreinigung ----------------------------------------------------------
[gcode_macro crash]
gcode:
    G90
    G1 X90 Y250 Z10 F19500

[gcode_macro CLEANNOZZLE]
gcode:
    {% set i = params.I|default(4)|int %}
    {% set s = params.S|default(100)|int %}
    _CG28
    SAVE_GCODE_STATE NAME=CLEANNOZZLE
    G90
    G0 X100 Z10 Y{printer.toolhead.axis_maximum.y} F19500
    G0 Z-1 F19500
    {% for iteration in range(i|int) %}
        G0 X50 F{s*60}
        G0 X100 F{s*60}
    {% endfor %}
    G0 X50 F{s*60}
    G0 Z10 F19500
    RESTORE_GCODE_STATE NAME=CLEANNOZZLE

[gcode_macro _SWIPENOZZLE]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=SWIPENOZZLE
    G90
    G0 X100 Z10 Y{printer.toolhead.axis_maximum.y} F19500
    G0 Z-1 F19500
    G0 X50 F2400
    G0 Z10 F19500
    RESTORE_GCODE_STATE NAME=SWIPENOZZLE

# --- Input Shaper ------------------------------------------------------------
[gcode_macro SHAPER_CAL]
gcode:
    SHAPER_CALIBRATE AXIS=X FREQ_END=100
    SHAPER_CALIBRATE AXIS=Y FREQ_END=100
    SAVE_CONFIG

# --- M109 (Wait for Hotend) --------------------------------------------------
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
    {% endif %}

# --- Geschwindigkeiten zurücksetzen ------------------------------------------
[gcode_macro _RESETSPEEDS]
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}