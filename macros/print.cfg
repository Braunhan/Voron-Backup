# =============================================================================
# macros/print.cfg — Druck-Start/Ende, Reinigung, Kalibrierung
# =============================================================================

# --- Quad Gantry Level (Zwei-Stufen) -----------------------------------------
[gcode_macro QGL_TWO_STEP]
gcode:
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=15 RETRY_TOLERANCE=1 RETRIES=10
    QUAD_GANTRY_LEVEL HORIZONTAL_MOVE_Z=6 RETRY_TOLERANCE=0.015 RETRIES=10

# --- Druck-Start -------------------------------------------------------------

[gcode_macro PRINT_START]
# Generated by "A better print_start macro wizard"
# Generated on: 2026-10-17 09:41:33
# Configuration:
#   - Printer: Voron V2.4
#   - Probe: Cartographer (Touch mode)
#   - Slicer: OrcaSlicer (2.4.1 or newer)
#   - Default chamber temp: 45°C
#   - Chamber thermistor
#   - Status text
#   - Respond message
#   - Purge line
#   - Bed mesh: adaptive
#   - Squiggly Purge

# OrcaSlicer start G-code (backup reference):
#   M104 S0 ; Cancel slicer-injected heating so PRINT_START controls it
#   M140 S0 ; Cancel slicer-injected heating so PRINT_START controls it
#   print_start EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature] CHAMBER_MINIMAL=[chamber_minimal_temperature]

gcode:
  # ---------- Read parameters passed in from the slicer ----------
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}
  {% set bed_was_cold = printer.heater_bed.temperature < target_bed - 10 %}

  # ---------- Print start summary ----------
  RESPOND MSG="🖨️ Print started! Hotend: {target_extruder}c, Bed: {target_bed}c, Chamber: {target_chamber_wait}c"

  # ---------- Clear any previous pause state and home all axes ----------
  CLEAR_PAUSE
  G28
  G90

  # ---------- Clear old bed mesh so a fresh one can be generated later ----------
  BED_MESH_CLEAR

  # ---------- Heat the bed (and soak chamber for higher-temp prints) ----------
  {% if target_bed > 90 %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    RESPOND MSG="🔥 Bed: {target_bed}c"
    # Part cooling fan helps circulate chamber air during the soak (100%)
    M106 S255
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}
    SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber_wait}c"
    RESPOND MSG="♨️ Heatsoak: {target_chamber_wait}c"
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={target_chamber_wait}

  {% else %}
    SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
    RESPOND MSG="🔥 Bed: {target_bed}c"
    G1 X{x_wait} Y{y_wait} Z15 F9000
    M190 S{target_bed}
    # Bett war kalt -> 5 min nachheizen lassen, damit sich die Platte nicht mehr verzieht
    {% if bed_was_cold %}
      SET_DISPLAY_TEXT MSG="Soak for 5 min"
      RESPOND MSG="⏳ Soak for 5 min"
      G4 P300000
    {% endif %}
  {% endif %}

  # ---------- Pre-heat hotend to a probe-safe temperature ----------
  SET_DISPLAY_TEXT MSG="Hotend: 150c"
  RESPOND MSG="🌡️ Hotend: 150c"
  M109 S150

  # ---------- Level the gantry to the bed, then re-home Z ----------
  SET_DISPLAY_TEXT MSG="Leveling"
  RESPOND MSG="📐 Leveling"
  QUAD_GANTRY_LEVEL

  # ---------- Touch-home for real Z0 ----------
  CARTOGRAPHER_TOUCH_HOME

  # ---------- Generate a fresh bed mesh at print temperatures ----------
  SET_DISPLAY_TEXT MSG="Bed mesh"
  RESPOND MSG="🔍 Bed mesh"
  BED_MESH_CALIBRATE ADAPTIVE=1

  # ---------- Skew-Korrektur (Calilantern) laden ----------
  SKEW_PROFILE LOAD=calilantern_skew_profile

  # ---------- Heat hotend to print temperature ----------
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  RESPOND MSG="🎯 Hotend: {target_extruder}c"
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107
  M109 S{target_extruder}

  # ---------- Purge / prime line, then hand off to the print ----------
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  RESPOND MSG="🚀 Printer goes brr"
  SQUIGGLY_PURGE

# --- Druck-Ende --------------------------------------------------------------
[gcode_macro PRINT_END]
# Generated by "A better print_start macro wizard"

gcode:
  # ---------- Safe anti-stringing move coords ----------
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

  # ---------- Wait for moves to finish and retract filament ----------
  M400
  G92 E0
  G1 E-10.0 F3600

  # ---------- Turn off heaters ----------
  TURN_OFF_HEATERS

  # ---------- Move away from the print (bounds-safe) ----------
  G90
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000

  # ---------- Park nozzle ----------
  G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 2} F3600

  # ---------- Turn off part cooling fan ----------
  M107

  # ---------- Clear the bed mesh ----------
  BED_MESH_CLEAR

  # ---------- Disable stepper motors ----------
  M84

  # ---------- Show completion message ----------
  SET_DISPLAY_TEXT MSG="Done printing, GG ✔️"
  RESPOND MSG="Done printing, GG ✔️"
  # ---------- Github Backup ---------- 
  RUN_SHELL_COMMAND CMD=git_backup

# --- Verzögertes Ausschalten -------------------------------------------------
[delayed_gcode DELAYED_OFF]
gcode:
    OFF

# --- Düsenreinigung ----------------------------------------------------------
[gcode_macro crash]
gcode:
    G90
    G1 X90 Y250 Z10 F19500

[gcode_macro CLEANNOZZLE]
gcode:
    {% set i = params.I|default(4)|int %}
    {% set s = params.S|default(100)|int %}
    _CG28
    SAVE_GCODE_STATE NAME=CLEANNOZZLE
    G90
    G0 X100 Z10 Y{printer.toolhead.axis_maximum.y} F19500
    G0 Z-1 F19500
    {% for iteration in range(i|int) %}
        G0 X50 F{s*60}
        G0 X100 F{s*60}
    {% endfor %}
    G0 X50 F{s*60}
    G0 Z10 F19500
    RESTORE_GCODE_STATE NAME=CLEANNOZZLE

[gcode_macro _SWIPENOZZLE]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=SWIPENOZZLE
    G90
    G0 X100 Z10 Y{printer.toolhead.axis_maximum.y} F19500
    G0 Z-1 F19500
    G0 X50 F2400
    G0 Z10 F19500
    RESTORE_GCODE_STATE NAME=SWIPENOZZLE

# --- Input Shaper ------------------------------------------------------------
[gcode_macro SHAPER_CAL]
gcode:
    SHAPER_CALIBRATE AXIS=X FREQ_END=100
    SHAPER_CALIBRATE AXIS=Y FREQ_END=100
    SAVE_CONFIG

# --- M109 (Wait for Hotend) --------------------------------------------------
[gcode_macro M109]
rename_existing: M99109
gcode:
    {% set s = params.S|float %}
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}
    {% endif %}

# --- Geschwindigkeiten zurücksetzen ------------------------------------------
[gcode_macro _RESETSPEEDS]
gcode:
    SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity}
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}