# =============================================================================
# macros/shaketune_all.cfg — Shake&Tune mit beiden Beschleunigungssensoren
# =============================================================================
# Führt Riemenvergleich und Input-Shaper-Test nacheinander mit jedem Sensor aus:
#   1. lis2dw                 (EBB36 Gen2, Toolhead)
#   2. adxl345 cartographer   (Cartographer v4)
# Die Grafiken landen in ShakeTune_results/belts bzw. /input_shaper,
# in dieser Reihenfolge (Zeitstempel im Dateinamen).
#
# Parameter: BELTS=0 überspringt den Riemenvergleich, SHAPER=0 den Shaper-Test.
#            SENSOR=all (Standard) | lis2dw | cartographer
# =============================================================================

[gcode_macro SHAKETUNE_ALL_SENSORS]
description: Riemen- und Input-Shaper-Test mit LIS2DW (EBB36) und ADXL345 (Cartographer)
gcode:
    {% set belts = params.BELTS|default(1)|int %}
    {% set shaper = params.SHAPER|default(1)|int %}
    {% set sensor = params.SENSOR|default("all")|lower %}
    {% set all_chips = {"lis2dw": "lis2dw", "cartographer": "adxl345 cartographer"} %}
    {% set chips = all_chips.values()|list if sensor == "all" else [all_chips[sensor]] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    # Direkt die Shake&Tune-Befehle (mit _) aufrufen: die Webui-Wrapper geben
    # ACCEL_CHIP ohne Anführungszeichen weiter, "adxl345 cartographer" bricht sonst
    {% for chip in chips %}
        RESPOND MSG="Shake&Tune mit Sensor: {chip}"
        {% if belts == 1 %}
            _COMPARE_BELTS_RESPONSES ACCEL_CHIP="{chip}"
        {% endif %}
        {% if shaper == 1 %}
            _AXES_SHAPER_CALIBRATION ACCEL_CHIP="{chip}"
        {% endif %}
    {% endfor %}
    RESPOND MSG="Shake&Tune fertig"

# =============================================================================
# SHAKETUNE_MULTI — beide Sensoren GLEICHZEITIG in einem Lauf
# =============================================================================
# Nutzt Klippers TEST_RESONANCES mit CHIPS=<beide>, wertet mit
# scripts/multi_accel.py aus (Klipper-Shaper-Berechnung, deutsche Beschriftung).
# Grafiken: ShakeTune_results/multi_sensor/
# Parameter: BELTS=0 / SHAPER=0 überspringt den jeweiligen Test.
# =============================================================================

[gcode_shell_command multi_accel]
command: /home/pi/klippy-env/bin/python /home/pi/printer_data/config/scripts/multi_accel.py
timeout: 900
verbose: True

[gcode_macro SHAKETUNE_MULTI]
description: Riemen + Input Shaper mit beiden Sensoren gleichzeitig, Vergleichsgrafiken
gcode:
    {% set belts = params.BELTS|default(1)|int %}
    {% set shaper = params.SHAPER|default(1)|int %}
    {% set chips = "lis2dw,adxl345 cartographer" %}
    {% set scv = printer.toolhead.square_corner_velocity %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if belts == 1 %}
        RESPOND MSG="Riemen A (1,-1), beide Sensoren..."
        TEST_RESONANCES AXIS=1,-1 OUTPUT=raw_data NAME=multibelts CHIPS="{chips}"
        RESPOND MSG="Riemen B (1,1), beide Sensoren..."
        TEST_RESONANCES AXIS=1,1 OUTPUT=raw_data NAME=multibelts CHIPS="{chips}"
        RESPOND MSG="Auswertung Riemen (1-2 min)..."
        RUN_SHELL_COMMAND CMD=multi_accel PARAMS="belts multibelts"
    {% endif %}
    {% if shaper == 1 %}
        RESPOND MSG="X-Achse, beide Sensoren..."
        TEST_RESONANCES AXIS=X OUTPUT=raw_data NAME=multishaper CHIPS="{chips}"
        RESPOND MSG="Y-Achse, beide Sensoren..."
        TEST_RESONANCES AXIS=Y OUTPUT=raw_data NAME=multishaper CHIPS="{chips}"
        RESPOND MSG="Auswertung Input Shaper (2-4 min)..."
        RUN_SHELL_COMMAND CMD=multi_accel PARAMS="shaper multishaper {scv}"
    {% endif %}
    RESPOND MSG="SHAKETUNE_MULTI fertig"
