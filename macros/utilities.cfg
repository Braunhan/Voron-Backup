# =============================================================================
# macros/utilities.cfg — Hilfsmakros, Parking, Heatsoak, Diagnose
# =============================================================================

# --- Conditional Homing ------------------------------------------------------
[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
        QUAD_GANTRY_LEVEL
        G28 Z
    {% endif %}

# --- Parking ----------------------------------------------------------------
[gcode_macro PARKFRONT]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z{printer.toolhead.axis_maximum.z/2} F19500
    RESTORE_GCODE_STATE NAME=PARKFRONT

[gcode_macro PARKFRONTLOW]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKFRONT
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} Z20 F19500
    RESTORE_GCODE_STATE NAME=PARKFRONT

[gcode_macro PARKREAR]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKREAR
    G90
    G0 X{printer.toolhead.axis_minimum.x+10} Y{printer.toolhead.axis_maximum.y-10} Z{printer.toolhead.axis_maximum.z-50} F19500
    RESTORE_GCODE_STATE NAME=PARKREAR

[gcode_macro PARKCENTER]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKCENTER
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z{printer.toolhead.axis_maximum.z/2} F19500
    RESTORE_GCODE_STATE NAME=PARKCENTER

[gcode_macro PARKBED]
gcode:
    _CG28
    SAVE_GCODE_STATE NAME=PARKBED
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} Z15 F19500
    RESTORE_GCODE_STATE NAME=PARKBED

# --- Alles aus ---------------------------------------------------------------
[gcode_macro OFF]
gcode:
    M84
    TURN_OFF_HEATERS
    M107
    SET_PIN PIN=caselight VALUE=0
    SET_NOZZLE_LEDS_BY_NAME COLOR="OFF"
    SET_LOGO_LEDS_BY_NAME COLOR="WHITE"

# --- Shutdown ---------------------------------------------------------------
[gcode_macro SHUTDOWN]
gcode:
    OFF
    {action_respond_info('action:poweroff')}
    {action_call_remote_method("shutdown_machine")}

# --- Heatsoak ---------------------------------------------------------------
[gcode_macro HEATSOAK]
gcode:
    {% set t = params.T|default(110)|int %}
    {% set c = params.C|default(75)|int %}
    {% set move = params.MOVE|default(1)|int %}
    {% set wait = params.WAIT|default(0)|int %}

    SAVE_GCODE_STATE NAME=HEATSOAK
    UPDATE_DELAYED_GCODE ID=DELAYED_OFF DURATION=0
    SET_PIN PIN=caselight VALUE=1
    M104 S0
    M140 S{t}
    {% if move == 1 %}
        SET_LOGO_LEDS_BY_NAME COLOR=ORANGE
        _CG28
        G90
        G0 Z{printer.toolhead.axis_maximum.z/2} F19500
        G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F19500
    {% endif %}
    {% if c > 30 and wait == 1 %}
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={c}
    {% endif %}
    RESTORE_GCODE_STATE NAME=HEATSOAK

# --- G32 (QGL shortcut) -----------------------------------------------------
[gcode_macro G32]
gcode:
    G28
    ATTACH_PROBE_LOCK
    QUAD_GANTRY_LEVEL
    G28 Z
    DOCK_PROBE_UNLOCK

# --- Pendel-Bewegung (Test) -------------------------------------------------
[gcode_macro PENDEL_BEWEGUNG]
description: Bewegt X in Schleife. Y fix auf 150, Z auf 30.
gcode:
    {% set x_min = params.X_MIN|default(10)|float %}
    {% set x_max = params.X_MAX|default(290)|float %}
    {% set y_pos = params.Y_POS|default(150)|float %}
    {% set z_pos = params.Z_POS|default(30)|float %}
    {% set speed = params.SPEED|default(100)|float * 60 %}
    {% set repeats = params.WIEDERHOLUNGEN|default(5)|int %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    G90
    G1 Z{z_pos} F600
    G1 X{x_min} Y{y_pos} F{speed}

    {action_respond_info("Pendel-Test: %d mal zwischen X%.1f und X%.1f bei Y%.1f" % (repeats, x_min, x_max, y_pos))}

    {% for i in range(repeats) %}
        G1 X{x_max} F{speed}
        G1 X{x_min} F{speed}
    {% endfor %}
    {action_respond_info("Fertig.")}

# --- Diagnose ---------------------------------------------------------------
[gcode_macro DUMP_VARIABLES]
gcode:
    {% set filter_name = params.NAME|default('')|string|lower %}
    {% set filter_value = params.VALUE|default('')|string|lower %}
    {% set show_cfg = params.SHOW_CFG|default(0)|int %}
    {% set out = [] %}
    {% for key1 in printer %}
        {% for key2 in printer[key1] %}
            {% if (show_cfg or not (key1|lower == 'configfile' and key2|lower in ['config', 'settings'])) and (filter_name in key1|lower or filter_name in key2|lower) and filter_value in printer[key1][key2]|string|lower %}
                {% set dummy = out.append("printer['%s'].%s = %s" % (key1, key2, printer[key1][key2])) %}
            {% endif %}
        {% else %}
            {% if filter_name in key1|lower and filter_value in printer[key1]|string|lower %}
                {% set dummy = out.append("printer['%s'] = %s" % (key1, printer[key1])) %}
            {% endif %}
        {% endfor %}
    {% endfor %}
    {action_respond_info(out|join("\n"))}

[gcode_macro GET_VARIABLE]
gcode:
    {% set names = (params.NAME).split('.')|list %}
    {% set join = (params.JOIN)|default(1)|int %}
    {% set _dummy0 = namespace( break = 0 ) %}
    {% set _dummy1 = namespace( out = printer[names|first] ) %}
    {% for name in names if _dummy0.break == 0 %}
        {% if loop.index > 1 %}
            {% if name in _dummy1.out %}
                {% set _dummy1.out = _dummy1.out[name] %}
            {% elif name[0] in '0123456789' and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping and _dummy1.out|length > name[0]|int %}
                {% set _dummy1.out = _dummy1.out[name|int] %}
            {% else %}
                {% set _dummy0.break = loop.index0 %}
            {% endif %}
        {% endif %}
    {% endfor %}
    {% if _dummy1.out is boolean %}
        { action_respond_info('Type: boolean') }
    {% elif _dummy1.out is float %}
        { action_respond_info('Type: float') }
    {% elif _dummy1.out is integer %}
        { action_respond_info('Type: integer') }
    {% elif _dummy1.out is mapping %}
        { action_respond_info('Type: mapping') }
    {% elif _dummy1.out is string %}
        { action_respond_info('Type: string') }
    {% elif _dummy1.out is iterable %}
        { action_respond_info('Type: iterable') }
    {% elif _dummy1.out is none %}
        { action_respond_info('Type: none') }
    {% elif _dummy1.out is undefined %}
        { action_respond_info('Type: undefined') }
    {% elif _dummy1.out is callable %}
        { action_respond_info('Type: callable') }
    {% else %}
        { action_respond_info('Type: unknown') }
    {% endif %}
    {% if join and _dummy1.out is iterable and _dummy1.out is not string and _dummy1.out is not mapping %}
        { action_respond_info('%s' % _dummy1.out|join("\n")) }
    {% else %}
        { action_respond_info('%s' % _dummy1.out) }
    {% endif %}
    {% if _dummy0.break != 0 %}
        { action_respond_info('"printer.%s" does not contain "%s"!' % (names[0:_dummy0.break]|join('.'), names[_dummy0.break])) }
    {% endif %}

# --- SB LEDs beim Start -----------------------------------------------------
[delayed_gcode SETSBRGB]
initial_duration: 1
gcode:
    SET_LOGO_LEDS_BY_NAME COLOR="WHITE"