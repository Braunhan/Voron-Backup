# =============================================================================
# printer.cfg — Haupteinstiegspunkt für Klipper
# =============================================================================
# Diese Datei enthält nur [include]-Anweisungen und den automatisch
# generierten SAVE_CONFIG-Block. Alle Hardware- und Makro-Definitionen
# sind in die entsprechenden Unterordner ausgelagert.
#
# Reihenfolge der Includes ist relevant:
#   1. UI & System (mainsail, timelapse)
#   2. Hardware (MCU, Stepper, Extruder, Bett, Lüfter, Probe)
#   3. Kalibrierung (QGL, Bed Mesh, Input Shaper)
#   4. LEDs (Neopixel, SB-Makros)
#   5. Makros (Print, Pause, Filament, Utilities)
#   6. Addons (KAMP, Filament-Sensor)
#   7. Globale Einstellungen (Voron-Definition)
# =============================================================================

# --- UI & System -----------------------------------------------------------
[include system/mainsail.cfg]
[include system/timelapse.cfg]

# --- Hardware: Kommunikation ------------------------------------------------
[include hardware/mcu.cfg]

# --- Hardware: Bewegung -----------------------------------------------------
[include hardware/steppers_xy.cfg]
[include hardware/steppers_z.cfg]

# --- Hardware: Extruder & Toolhead ------------------------------------------
[include hardware/extruder.cfg]

# --- Hardware: Heizbett & Kammer --------------------------------------------
[include hardware/bed.cfg]

# --- Hardware: Lüfter -------------------------------------------------------
[include hardware/fans.cfg]

# --- Hardware: Probe --------------------------------------------------------
[include hardware/probe.cfg]

# --- Kalibrierung -----------------------------------------------------------
[include calibration/qgl.cfg]
[include calibration/bedmesh.cfg]
[include calibration/shaper.cfg]
[include calibration/safezhome.cfg]

# --- LEDs -------------------------------------------------------------------
[include leds/neopixel.cfg]
[include leds/sb_leds.cfg]
[include leds/chamber_leds.cfg]

# --- Makros -----------------------------------------------------------------
[include macros/*.cfg]


# --- Addons -----------------------------------------------------------------
#[include KlickyProbe/*.cfg]
[include addons/kamp.cfg]
[include addons/filamentsensor.cfg]
[include addons/zero_overshoot.cfg]
[include addons/nozzle_scrub.cfg]

# --- Globale Einstellungen --------------------------------------------------
[include system/voron24.cfg]

# --- Git-Autobackup nach jedem Druck ---------------------------------
[gcode_shell_command git_backup]
command: /home/pi/printer_data/config/git-backup.sh
timeout: 30
verbose: False

