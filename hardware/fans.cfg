# =============================================================================
# hardware/fans.cfg — Lüfter-Steuerung
# =============================================================================
# Drei temperaturgesteuerte Lüfter:
#   1. Octopus_24V:     Kühlt die Octopus-MCU (ab 45°C)
#   2. Raspberry_Pi_12V: Kühlt den Raspberry Pi (ab 40°C)
#   3. hotend_fan:      Hotend-Lüfter (EBB:PA5, ab 50°C Hotend-Temp)
#
# Part-Cooling-Lüfter: EBB:PD3 (am Toolhead)
# =============================================================================

# --- Multi-Pin für zwei Lüfter an einem Pin ----------------------------------
[multi_pin fan]
pins: PE5, PD12

[duplicate_pin_override]
pins: temperature_mcu

# --- Octopus-MCU-Lüfter (24V, Pin PA8) ---------------------------------------
[temperature_fan Octopus_24V]
pin: PA8
kick_start_time: 0.5
max_power: 1
min_temp: 0
max_temp: 90
max_delta: 5
target_temp: 45
control: watermark
shutdown_speed: 0
sensor_type: temperature_mcu

# --- Raspberry-Pi-Lüfter (12V, Multi-Pin PE5/PD12) ---------------------------
[temperature_fan Raspberry_Pi_12V]
pin: multi_pin:fan
kick_start_time: 0.5
max_power: 1
min_temp: 0
max_temp: 90
max_speed: 1
max_delta: 10
target_temp: 40
control: watermark
shutdown_speed: 0
sensor_type: temperature_host

# --- Part-Cooling-Lüfter (am EBB36 Gen2, PD3) -------------------------------
[fan]
pin: EBB:PD3

# --- Hotend-Lüfter (am EBB36 Gen2, PA5) -------------------------------------
[heater_fan hotend_fan]
pin: EBB:PA5
heater: extruder
heater_temp: 50.0