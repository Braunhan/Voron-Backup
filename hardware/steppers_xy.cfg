# =============================================================================
# hardware/steppers_xy.cfg — X/Y-Achsen (CoreXY)
# =============================================================================
# X- und Y-Achse des CoreXY-Systems. Beide verwenden:
#   - GT2-20T Riemenscheiben → rotation_distance = 40 mm
#   - 1.8°-Schrittmotoren (200 Vollschritte/Umdrehung)
#   - 128 Microsteps für hohe Auflösung
#   - TMC2240-Treiber im SPI-Modus (run_current: 1.0 A)
#
# X-Endstop: EBB:PA15 (am Toolhead)
# Y-Endstop: PG9 (am Octopus)
# =============================================================================

# --- TMC Auto-Tuning (optional, nur bei Bedarf aktivieren) --------------------
[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1
tuning_goal: auto

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1
tuning_goal: auto

# --- X-Achse: Links (MOTOR_0, Endstop EBB:PA15) ------------------------------
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200
endstop_pin: EBB:PA15
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 80
second_homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_speed: 100000
run_current: 1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# --- Y-Achse: Rechts (MOTOR_1, Endstop PG9) ---------------------------------
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 128
full_steps_per_rotation: 200
endstop_pin: PG9
position_min: 0
position_endstop: 303
position_max: 303
homing_speed: 60
second_homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD11
spi_speed: 100000
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
run_current: 1