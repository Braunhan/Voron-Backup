# =============================================================================
# hardware/probe.cfg — Bett-Sensor (Klicky / Cartographer)
# =============================================================================
# Aktuell: Klicky PCB Microswitch am EBB36 Gen2 Probe-Port (PB8)
# Der Pin ist invertiert (!), da der Schalter im Ruhezustand
# HIGH liefert und bei Kontakt auf LOW zieht.
#
# Bei Umstieg auf Cartographer v4:
#   - Diese Sektion durch [cartographer]-Konfig ersetzen
#   - Cartographer-Plugin installieren (cartographer-klipper)
# =============================================================================

[probe]
pin: !EBB:PB8
x_offset: 0
y_offset: 25
z_offset: 5
speed: 15
samples: 2
sample_retract_dist: 0.8
lift_speed: 25.0
samples_result: median
samples_tolerance: 0.01
samples_tolerance_retries: 5