# =============================================================================
# hardware/probe.cfg — Bett-Sensor (Cartographer v4 CAN)
# =============================================================================
# Cartographer v4 Eddy-Current mit Touch-Mode, CAN-Bus.
# ADXL345 via SPI1, cs_pin = PA0 (V4-spezifisch, V3 wäre PA3).
# =============================================================================

# --- ALT: Klicky PCB Microswitch (auskommentiert) ----------------------------
# [probe]
# pin: !EBB:PB8
# x_offset: 0
# y_offset: 25
# z_offset: 5
# speed: 15
# samples: 2
# sample_retract_dist: 0.8
# lift_speed: 25.0
# samples_result: median
# samples_tolerance: 0.01
# samples_tolerance_retries: 5

# --- Cartographer MCU (CAN) --------------------------------------------------
[mcu cartographer]
canbus_uuid: ca7fda0cb0c9
#restart_method: command

# --- Cartographer Sensor -----------------------------------------------------
[cartographer]
mcu: cartographer
x_offset: 0          # TODO: Düse → Spulenmitte messen!
y_offset: 25         # TODO: Düse → Spulenmitte messen!
verbose: no

# --- Temperatur-Überwachung --------------------------------------------------
[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

# --- ADXL345 via Cartographer (V4: PA0, V3: PA3) -----------------------------
[adxl345 cartographer]
cs_pin: cartographer:PA0
spi_bus: spi1
