# =============================================================================
# hardware/bed.cfg — Heizbett & Kammer-Thermistor
# =============================================================================
# Heizbett: 230V-Silikonheizung via SSR (PA3), max 120°C
# Kammer-Thermistor: Generic 3950 an PF5
# =============================================================================

# --- Heizbett (SSR an HE1, Thermistor an TB) ---------------------------------
[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
control: pid
pid_Kp: 66.488
pid_Ki: 2.995
pid_Kd: 369.008
max_power: 1
min_temp: 0
max_temp: 120

# --- Kammer-Thermistor -------------------------------------------------------
[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PF5
gcode_id: C