# =============================================================================
# hardware/mcu.cfg — MCU-Kommunikation
# =============================================================================
# Definiert die Verbindung zu den beiden Mikrocontrollern:
#   - mcu:    BTT Octopus Pro v1.1 (STM32H723) via CAN-Bus
#   - mcu EBB: BTT EBB36 CAN Gen2 (STM32G0B1) via CAN-Bus
#
# Beide MCUs kommunizieren über CAN (1 Mbps). Die Octopus fungiert
# als USB-zu-CAN-Bridge (canbus_uuid), der EBB36 hängt am selben Bus.
# =============================================================================

# --- Haupt-MCU: BTT Octopus Pro v1.1 (STM32H723) -----------------------------
# Firmware kompiliert mit: 128KiB Bootloader, 25 MHz Crystal, USB
# Kommunikation über CAN-Bus (USB-to-CAN Bridge)
[mcu]
canbus_uuid: 3763500466d6

# --- Toolhead-MCU: BTT EBB36 CAN Gen2 (STM32G0B1) ----------------------------
# Firmware kompiliert mit: 8KiB Bootloader, 8 MHz Crystal, CAN (PB12/PB13)
[mcu EBB]
canbus_uuid: fa50ca5ee1dc