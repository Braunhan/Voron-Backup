# =============================================================================
# hardware/steppers_z.cfg — Z-Achsen (4-Motor Flying Gantry)
# =============================================================================
# Der Voron 2.4 verwendet vier unabhängige Z-Motoren für Quad Gantry Leveling.
# Jeder Motor treibt über eine 80:16-Untersetzung eine GT2-20T-Riemenscheibe.
# Effektive rotation_distance = 40 / (80/16) = 8 mm.
#
# Motorspezifikation:
#   - 1.8°-Schrittmotoren (200 Vollschritte)
#   - 64 Microsteps
#   - TMC2240-Treiber im SPI-Modus (run_current: 1.0 A)
#
# Z-Endstop: PG10 (mechanischer Endstop am Octopus)
# =============================================================================

# --- Z0: Vorne Links (MOTOR_2) -----------------------------------------------
[stepper_z]
enable_pin: !PG5
step_pin: PF11
dir_pin: !PG3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64
endstop_pin: PG10
position_endstop: -0.5
position_max: 260
position_min: -10
homing_speed: 15
second_homing_speed: 4
homing_retract_dist: 0.7

[tmc2240 stepper_z]
cs_pin: PC6
spi_speed: 100000
run_current: 1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# --- Z1: Hinten Links (MOTOR_3) ---------------------------------------------
[stepper_z1]
enable_pin: !PD4
step_pin: PE2
dir_pin: PE3
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z1]
cs_pin: PE1
spi_speed: 100000
run_current: 1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# --- Z2: Hinten Rechts (MOTOR_4) --------------------------------------------
[stepper_z2]
enable_pin: !PG2
step_pin: PF9
dir_pin: !PF10
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z2]
cs_pin: PF2
spi_speed: 100000
run_current: 1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

# --- Z3: Vorne Rechts (MOTOR_5) ---------------------------------------------
[stepper_z3]
enable_pin: !PF1
step_pin: PC13
dir_pin: PF0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 64

[tmc2240 stepper_z3]
cs_pin: PE4
spi_speed: 100000
run_current: 1
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6