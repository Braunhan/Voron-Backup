# =============================================================================
# hardware/extruder.cfg — Extruder & Toolhead (EBB36 Gen2, Sherpa Mini 8T)
# =============================================================================
# Alle Komponenten am Toolhead, gesteuert vom BTT EBB36 CAN Gen2:
#   - Extruder-Motor: Sherpa Mini 8T (TMC2209, UART, 0.95 A, 75:10)
#   - Heizpatrone (PB4, max 350°C)
#   - Thermistor: ATC Semitec 104NT-4 (PA3)
#   - EBB36 Board-Temperatursensor (PA0)
#   - LIS2DW Beschleunigungssensor (integriert)
# =============================================================================

# --- EBB36 Board-Temperatur --------------------------------------------------
[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

# --- LIS2DW Beschleunigungssensor (EBB36 Gen2 integriert) --------------------
#[lis2dw]
#cs_pin: EBB:PB1
#spi_bus: spi2_PB2_PB11_PB10
#axes_map: x,y,z
#
# --- Extruder (Sherpa Mini 8T, 75:10) ----------------------------------------
[extruder]
step_pin: EBB:PB14
dir_pin: EBB:PA8
enable_pin: !EBB:PB6
rotation_distance: 34.6544
gear_ratio: 75:10
microsteps: 64
full_steps_per_rotation: 200
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
max_extrude_only_distance: 5000
max_extrude_only_velocity: 120
max_extrude_only_accel: 8000
min_extrude_temp: 17
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 5

heater_pin: EBB:PB4
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBB:PA3
pullup_resistor: 2200
min_temp: -50
max_temp: 350

# --- Verify Heater ------------------------------------------------------------
[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 2

# --- Extruder-Motor (TMC2209) -------------------------------------------------
[tmc2209 extruder]
uart_pin: EBB:PB3
interpolate: true
run_current: 0.95
sense_resistor: 0.11
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4