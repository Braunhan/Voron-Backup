# =============================================================================
# hardware/extruder.cfg — Extruder & Toolhead (EBB36 Gen2)
# =============================================================================
# Alle Komponenten am Toolhead, gesteuert vom BTT EBB36 CAN Gen2:
#   - Extruder-Motor (TMC2209, UART, 0.65 A)
#   - Heizpatrone (PB4, max 250°C)
#   - Thermistor (PA3, NTC 100K)
#   - EBB36 Board-Temperatursensor (PA0)
#   - LIS2DW Beschleunigungssensor (integriert)
#
# ACHTUNG: Thermistor-Typ prüfen!
#   - Bei ATC Semitec 104NT-4: sensor_type = ATC Semitec 104NT-4-R025H42G
#   - Bei EPCOS 100K:          sensor_type = EPCOS 100K B57560G104F
# =============================================================================

# --- EBB36 Board-Temperatur --------------------------------------------------
[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

# --- LIS2DW Beschleunigungssensor (EBB36 Gen2 integriert) --------------------
[lis2dw]
cs_pin: EBB:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

# --- Extruder (Phaetus Rapido Plus UHF) -------------------------------------
[extruder]
step_pin: EBB:PB14
dir_pin: EBB:PA8
enable_pin: !EBB:PB6
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB4
sensor_type: EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: EBB:PA3
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 250

# --- Extruder-Motor (TMC2209) ------------------------------------------------
[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.650
stealthchop_threshold: 999999