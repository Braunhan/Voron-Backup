# =============================================================================
# voron24.cfg — Globale Drucker-Definition
# =============================================================================
# Legt Kinematik, Geschwindigkeiten und grundlegende Einstellungen
# für den Voron 2.4 fest. Wird als letztes include geladen,
# damit Hardware-Definitionen Vorrang haben können.
# =============================================================================

# --- Drucker-Kinematik -------------------------------------------------------
# Voron 2.4 verwendet CoreXY. max_accel und max_velocity sind bewusst
# hoch angesetzt — die tatsächlichen Werte werden durch Input Shaper
# und Druckqualität begrenzt.
[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 55
max_z_accel: 350
square_corner_velocity: 20
minimum_cruise_ratio: 0.5

# --- Leerlauf-Abschaltung ----------------------------------------------------
# Schaltet Heizbett und Hotend nach 30 Minuten Inaktivität ab.
[idle_timeout]
timeout: 1800

# --- Schiefstellungskorrektur -------------------------------------------------
# Kalibrierte Werte aus dem Skew-Profile (Calilantern-Methode).
[skew_correction]

# --- G-Code Erweiterungen ----------------------------------------------------
# G2/G3 Bögen mit adaptiver Segmentierung.
[gcode_arcs]
resolution: 0.008

# --- Objekt-Ausschluss -------------------------------------------------------
# Erlaubt das Überspringen fehlgeschlagener Objekte während des Drucks.
[exclude_object]

# --- Display-Pins (EXP1/EXP2) ------------------------------------------------
# Pin-Belegung für das BTT Octopus Pro Display.
[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>